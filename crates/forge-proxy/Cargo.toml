[package]
name = "forge-proxy"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"

[features]
default = []
# Expose test helpers (test_helpers module) for use in integration tests or
# downstream crates that need forge-proxy test utilities without being in a
# #[cfg(test)] context.  Always enabled automatically when running `cargo test`.
test-helpers = []

[dependencies]
axum = { workspace = true }
anyhow = { workspace = true }
forge-core = { path = "../forge-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
dashmap = { workspace = true }
governor = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
uuid = { workspace = true }
futures = { workspace = true }
subtle = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "process"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
dashmap = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
futures = { workspace = true }
